aid: eco-gear
name: Eco Gear
description: Eco Gear (에코기어) is a South Korean food-technology company that develops natural
  biomaterial-based nano-coating preservation agents which extend the freshness of fresh produce
  and reduce food waste across the cold chain. Its product line — Flowting for cut flowers, Ecocell
  for stevia tomatoes, and Fruiting for citrus — forms an invisible, food-safe protective layer that
  slows moisture loss, browning, and mold without synthetic waxes or harmful emulsifiers, with field
  trials showing spoilage reduced by up to 71%. The company markets a physical-products and R&D
  business and does not currently publish a public developer API. Backed by 500 Global.
